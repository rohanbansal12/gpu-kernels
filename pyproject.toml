[project]
name = "gpu-kernels"
version = "0.1.0"
description = "Torch/JAX/Triton GPU kernel learning harness with roofline benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.6",
]
jax = [
    "jax>=0.5",
]
triton = [
    "triton>=3.0",
]
local = [
    "gpu-kernels[torch,jax]",
]
cuda = [
    "gpu-kernels[torch,jax,triton]",
]
gpu = [
    "gpu-kernels[cuda]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.395",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_kernels", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "benchmarks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM"]
ignore = ["E741"]

[tool.pyright]
include = ["src", "benchmarks", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA-capable GPU",
    "perf: performance regression test",
    "torch: requires PyTorch",
    "jax: requires JAX",
    "triton: requires Triton",
]
filterwarnings = [
    "ignore:`torch\\.jit\\.script_method` is deprecated:DeprecationWarning:torch\\.jit\\._script",
]
